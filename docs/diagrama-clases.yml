@startuml moveSmartClassDiagram

title MOVE SMART - Diagrama de Clases
header Product Owner: Brandon Berrio / Ángel Camilo
header Developers: Brandon Berrio / Ángel Camilo
footer Febrero 2026

skinparam classAttributeIconSize 0
skinparam style strictuml

' =========================
' CLASE BASE USUARIO
' =========================
abstract class Usuario {
  - id: int
  - nombre: string
  - email: string
  - password: string
  - rol: string
  - created_at: timestamp
  + login(): boolean
  + logout(): void
}

class Ciudadano {
  + visualizarRutas(): List<Ruta>
  + visualizarParadas(): List<Parada>
  + visualizarZonasCriticas(): List<ZonaCritica>
  + navegarMapa(): void
}

class Administrador {
  + crearUsuario(): Usuario
  + editarUsuario(): Usuario
  + eliminarUsuario(): boolean
  + crearRuta(): Ruta
  + editarRuta(): Ruta
  + eliminarRuta(): boolean
  + crearZonaCritica(): ZonaCritica
  + editarZonaCritica(): ZonaCritica
  + eliminarZonaCritica(): boolean
  + crearParada(): Parada
  + editarParada(): Parada
  + eliminarParada(): boolean
  + generarReporte(): Reporte
}

Usuario <|-- Ciudadano
Usuario <|-- Administrador

' =========================
' ENTIDADES DEL DOMINIO
' =========================
class Ruta {
  - id: int
  - nombre: string
  - tipo: string
  - color_hex: string
  - distancia_km: decimal
  - tiempo_estimado_min: int
  - eficiencia_porcentaje: decimal
  + calcularTiempo(): int
}

class Parada {
  - id: int
  - ruta_id: int
  - nombre: string
  - latitud: decimal
  - longitud: decimal
  - orden: int
}

class ZonaCritica {
  - id: int
  - nombre: string
  - nivel_congestion: string
  - latitud: decimal
  - longitud: decimal
  - descripcion_impacto: string
}

class Metrica {
  - id: int
  - ruta_id: int
  - fecha: date
  - usuarios_totales: int
  - ocupacion_promedio: decimal
  - tiempo_promedio: int
  - combustible_consumido: decimal
  + calcularEficiencia(): decimal
}

class Reporte {
  - id: int
  - tipo: string
  - periodo_inicio: date
  - periodo_fin: date
  - generado_por: int
  + exportarPDF(): file
  + exportarCSV(): file
}

' =========================
' RELACIONES
' =========================
Ruta "1" o-- "*" Parada
Ruta "*" -- "*" ZonaCritica
Ruta "1" o-- "*" Metrica
Administrador "1" -- "*" Usuario : administra
Reporte "*" -- "1" Usuario : generado_por

' =========================
' NOTAS EXPLICATIVAS
' =========================
note bottom of Ciudadano
  **Acceso Limitado: Solo Lectura**
  - Habitante de Manizales
  - Usuario de transporte público
  - Frontend público (Web/App)
  - No modifica información
end note

note bottom of Administrador
  **Acceso Total: Administración**
  - Equipo técnico / TI
  - Desarrolladores del sistema
  - Administra usuarios y seguridad
end note

note bottom of Ruta
  Estados posibles:
  - actual: Ruta en operación
  - optimizada: Ruta mejorada
end note

@enduml