services:

  # ==========================================
  # FRONTEND - React + Vite + Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: movesmart-frontend

    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - movesmart_network


  # ==========================================
  # BACKEND - Node.js + Express
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: movesmart-backend

    restart: unless-stopped

    ports:
      - "4000:4000"

    env_file:
      - .env

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - movesmart_network


  # ==========================================
  # DATABASE - MySQL
  # ==========================================
  mysql:
    image: mysql:8.4

    container_name: movesmart-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${DB_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - movesmart_network


  # ==========================================
  # PHPMYADMIN - Administración de MySQL
  # ==========================================
  phpmyadmin:
    image: phpmyadmin:latest

    container_name: movesmart-phpmyadmin

    restart: unless-stopped

    ports:
      - "8081:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - movesmart_network


# ==========================================
# VOLUMES
# ==========================================
volumes:
  mysql_data:


# ==========================================
# NETWORK
# ==========================================
networks:
  movesmart_network:
    driver: bridge